[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "koemi"
version = "0.4.0"
description = "Koemi-4HCM (Koemi-4 HERM Consolidation Model) byte-level causal training architecture"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1", "torch>=2.8"]

[project.scripts]
koemi = "koemi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
